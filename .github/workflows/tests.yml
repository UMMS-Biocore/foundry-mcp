name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package and the SDK pinned in the Dockerfile
        run: |
          SDK_REF=$(sed -n 's/^ARG SDK_GIT_REF=//p' Dockerfile)
          test -n "$SDK_REF"
          python -m pip install --upgrade pip
          pip install -e '.[dev]' "git+https://github.com/UMMS-Biocore/foundry-sdk.git@${SDK_REF}"
      - name: Run tests
        run: python -m pytest -q
