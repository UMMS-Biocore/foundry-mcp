[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-mcp"
version = "1.2.2"
description = "Model Context Protocol (MCP) server for Foundry Connect SDK"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "UMMS Biocore"}
]
keywords = ["mcp", "foundry", "bioinformatics", "workflow", "model-context-protocol"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
    # Upper bound is load-bearing: mcp 2.0.0 removed `mcp.server.fastmcp` and
    # renamed FastMCP to `mcp.server.mcpserver.MCPServer`, so an unbounded
    # resolve breaks `src/foundry_mcp/server.py` at import time. Migrating to
    # the 2.x API is separate work; until then stay on 1.x.
    "mcp>=1.0.0,<2",
    "viafoundry_sdk>=1.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/UMMS-Biocore/foundry-mcp"
Documentation = "https://github.com/UMMS-Biocore/foundry-mcp#readme"
Repository = "https://github.com/UMMS-Biocore/foundry-mcp"
Issues = "https://github.com/UMMS-Biocore/foundry-mcp/issues"

[project.scripts]
foundry-mcp = "foundry_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["foundry_mcp*"]
exclude = ["test*"]

[tool.setuptools.package-data]
foundry_mcp = ["py.typed"]
