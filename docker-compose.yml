# =============================================================================
# Foundry Connect MCP Server - Docker Compose
# =============================================================================
#
# Quick Start:
#   docker compose up
#
# With custom port:
#   PORT=9000 docker compose up
#
# Build and run:
#   docker compose up --build
#
# =============================================================================

services:
  foundry-mcp:
    build: .
    image: foundry-mcp:latest
    container_name: foundry-mcp
    ports:
      - "${PORT:-8705}:${PORT:-8705}"
    environment:
      - PORT=${PORT:-8705}
    # Map 'localhost' inside container to host machine (Docker Desktop for Mac)
    extra_hosts:
      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

    # Health check (TCP port check)
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost', ${PORT:-8705})); s.close()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
